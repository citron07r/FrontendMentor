<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Huddle landing page with single introductory section</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple-700: hsl(257, 40%, 49%);
      --magenta-400: hsl(300, 69%, 71%);
      --font-headings: 'Poppins', sans-serif;
      --font-body: 'Open Sans', sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body, h1, p {
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--purple-700);
      background-image: url('images/bg-mobile.svg');
      background-repeat: no-repeat;
      background-position: top left;
      background-size: 100vw auto;
      font-family: var(--font-body);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      body {
        background-image: url('images/bg-desktop.svg');
        background-size: auto;
        background-position: top left;
      }
    }

    .content-wrapper {
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    header {
      padding: 2.5rem 2rem;
    }

    .logo {
      width: 120px;
      height: auto;
    }

    @media (min-width: 1024px) {
      header {
        padding: 4rem 5rem 0;
      }

      .logo {
        width: 200px;
      }
    }

    main {
      padding: 2rem 2rem 3rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 3rem;
    }

    .img-col {
      width: 100%;
    }

    .hero-img {
      width: 100%;
      max-width: 500px;
      height: auto;
    }

    .text-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    @media (min-width: 1024px) {
      main {
        padding: 4rem 5rem 2rem;
        flex-direction: row;
        text-align: left;
        gap: 4rem;
      }

      .img-col {
        flex: 0 0 55%;
        max-width: 55%;
        text-align: left;
      }

      .hero-img {
        max-width: 100%;
      }

      .text-col {
        flex: 1;
        align-items: flex-start;
      }
    }

    h1 {
      font-family: var(--font-headings);
      font-weight: 600;
      font-size: 1.5rem;
      line-height: 1.5;
    }

    p {
      font-family: var(--font-body);
      font-weight: 400;
      font-size: 1rem;
      line-height: 1.6;
      opacity: 0.95;
    }

    @media (min-width: 1024px) {
      h1 {
        font-size: 2.5rem;
      }

      p {
        font-size: 1.125rem;
      }
    }

    .btn-register {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #fff;
      color: var(--purple-700);
      font-family: var(--font-headings);
      font-weight: 400;
      font-size: 1rem;
      border-radius: 999px;
      width: 200px;
      height: 2.5rem;
      border: none;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
      transition: background-color 0.2s ease, color 0.2s ease;
      margin-top: 0.5rem;
    }

    @media (min-width: 1024px) {
      .btn-register {
        height: 3.5rem;
        font-size: 1.125rem;
      }
    }

    .btn-register:hover,
    .btn-register:focus-visible {
      background-color: var(--magenta-400);
      color: #fff;
    }

    .btn-register:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    footer {
      padding: 0 2rem 2.5rem;
      display: flex;
      justify-content: center;
    }

    .social-links {
      display: flex;
      gap: 1rem;
    }

    .social-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border: 1px solid #fff;
      border-radius: 50%;
      color: #fff;
      text-decoration: none;
      transition: border-color 0.2s ease, color 0.2s ease;
    }

    .social-links svg {
      width: 1rem;
      height: 1rem;
      fill: currentColor;
      transition: fill 0.2s ease;
    }

    .social-links a:hover,
    .social-links a:focus-visible {
      border-color: var(--magenta-400);
      color: var(--magenta-400);
      outline: none;
    }

    .social-links a:focus-visible {
      outline: 2px solid var(--magenta-400);
      outline-offset: 4px;
    }

    @media (min-width: 1024px) {
      footer {
        padding: 0 5rem 2.5rem;
        justify-content: flex-end;
      }

      .social-links a {
        width: 2.5rem;
        height: 2.5rem;
      }

      .social-links svg {
        width: 1.25rem;
        height: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <div class="content-wrapper">
    <header>
      <img src="images/logo.svg" alt="Huddle Logo" class="logo">
    </header>
    
    <main>
      <div class="img-col">
        <img src="images/illustration-mockups.svg" alt="Illustration of application mockups on various screens" class="hero-img">
      </div>
      <div class="text-col">
        <h1>Build The Community Your Fans Will Love</h1>
        <p>Huddle re-imagines the way we build communities. You have a voice, but so does your audience. Create connections with your users as you engage in genuine discussion.</p>
        <a href="#" class="btn-register">Register</a>
      </div>
    </main>

    <footer>
      <div class="social-links">
        <a href="#" aria-label="Facebook">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2.04C6.5 2.04 2 6.53 2 12.06C2 17.06 5.66 21.21 10.44 21.96V14.96H7.9V12.06H10.44V9.85C10.44 7.34 11.93 5.96 14.22 5.96C15.31 5.96 16.45 6.15 16.45 6.15V8.62H15.19C13.95 8.62 13.56 9.39 13.56 10.18V12.06H16.34L15.89 14.96H13.56V21.96A10 10 0 0 0 22 12.06C22 6.53 17.5 2.04 12 2.04Z"/>
          </svg>
        </a>
        <a href="#" aria-label="Twitter">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M22.46 6C21.69 6.35 20.86 6.58 20 6.69C20.88 6.16 21.56 5.32 21.88 4.31C21.05 4.81 20.13 5.16 19.16 5.36C18.37 4.5 17.26 4 16 4C13.65 4 11.73 5.92 11.73 8.29C11.73 8.63 11.77 8.96 11.84 9.27C8.28 9.09 5.11 7.38 3 4.79C2.63 5.42 2.42 6.16 2.42 6.94C2.42 8.43 3.17 9.75 4.33 10.5C3.62 10.5 2.96 10.3 2.38 10V10.03C2.38 12.11 3.86 13.85 5.82 14.24C5.46 14.34 5.08 14.39 4.69 14.39C4.42 14.39 4.15 14.36 3.89 14.31C4.43 16.03 6.02 17.29 7.91 17.33C6.43 18.5 4.56 19.19 2.5 19.19C2.14 19.19 1.79 19.17 1.45 19.13C3.36 20.35 5.62 21.07 8.03 21.07C15.93 21.07 20.25 14.52 20.25 8.84C20.25 8.65 20.24 8.47 20.24 8.28C21.08 7.68 21.82 6.9 22.46 6Z"/>
          </svg>
        </a>
        <a href="#" aria-label="Instagram">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M7.8 2H16.2C19.4 2 22 4.6 22 7.8V16.2C22 19.4 19.4 22 16.2 22H7.8C4.6 22 2 19.4 2 16.2V7.8C2 4.6 4.6 2 7.8 2ZM7.6 4C5.6 4 4 5.6 4 7.6V16.4C4 18.4 5.6 20 7.6 20H16.4C18.4 20 20 18.4 20 16.4V7.6C20 5.6 18.4 4 16.4 4H7.6ZM12 7.25C14.62 7.25 16.75 9.38 16.75 12C16.75 14.62 14.62 16.75 12 16.75C9.38 16.75 7.25 14.62 7.25 12C7.25 9.38 9.38 7.25 12 7.25ZM12 9.25C10.48 9.25 9.25 10.48 9.25 12C9.25 13.52 10.48 14.75 12 14.75C13.52 14.75 14.75 13.52 14.75 12C14.75 10.48 13.52 9.25 12 9.25ZM17.25 5.5C17.94 5.5 18.5 6.06 18.5 6.75C18.5 7.44 17.94 8 17.25 8C16.56 8 16 7.44 16 6.75C16 6.06 16.56 5.5 17.25 5.5Z"/>
          </svg>
        </a>
      </div>
    </footer>
  </div>
</body>
</html>
