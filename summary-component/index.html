<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>
  <main class="card">
    <section class="panel-result" aria-labelledby="result-heading">
      <h1 id="result-heading">Your Result</h1>
      <div class="score-circle">
        <span class="score">76</span>
        <span class="max-score">of 100</span>
      </div>
      <div class="grade">Great</div>
      <p class="description">You scored higher than 65% of the people who have taken these tests.</p>
    </section>

    <section class="panel-summary" aria-labelledby="summary-heading">
      <h2 id="summary-heading">Summary</h2>
      <ul class="summary-list">
        <li class="summary-item item-reaction">
          <div class="category">
            <img src="./assets/images/icon-reaction.svg" alt="">
            <span>Reaction</span>
          </div>
          <div class="score-wrapper">
            <span class="score-value">80</span>
            <span class="score-max"> / 100</span>
          </div>
        </li>
        <li class="summary-item item-memory">
          <div class="category">
            <img src="./assets/images/icon-memory.svg" alt="">
            <span>Memory</span>
          </div>
          <div class="score-wrapper">
            <span class="score-value">92</span>
            <span class="score-max"> / 100</span>
          </div>
        </li>
        <li class="summary-item item-verbal">
          <div class="category">
            <img src="./assets/images/icon-verbal.svg" alt="">
            <span>Verbal</span>
          </div>
          <div class="score-wrapper">
            <span class="score-value">61</span>
            <span class="score-max"> / 100</span>
          </div>
        </li>
        <li class="summary-item item-visual">
          <div class="category">
            <img src="./assets/images/icon-visual.svg" alt="">
            <span>Visual</span>
          </div>
          <div class="score-wrapper">
            <span class="score-value">72</span>
            <span class="score-max"> / 100</span>
          </div>
        </li>
      </ul>
      <button class="btn-continue">Continue</button>
    </section>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/citron07r">citron07r</a>.
  </footer>
</body>
</html>
